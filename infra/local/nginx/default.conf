log_format local_safe escape=json '{"event":"gateway.request","requestId":"$request_id","method":"$request_method","statusCode":$status,"durationSeconds":$request_time}';

server {
    access_log /var/log/nginx/access.log local_safe;
    listen 81;
    server_name _;
    absolute_redirect off;
    client_max_body_size 1m;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $core_origin http://core:4000;

    location = / { return 302 /api/v1/docs; }

    # API routes share the Swagger origin so Try it out can use session cookies.
    location = /api/v1/realtime {
        proxy_pass $core_origin$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass $core_origin$request_uri;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_no_cache 1;
    }

    location / { return 404; }
}

server {
    access_log /var/log/nginx/access.log local_safe;
    listen 80;
    server_name _;
    client_max_body_size 1m;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $core_origin http://core:4000;
    set $web_origin http://web:3000;

    location = /gateway-health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"gateway"}';
    }

    location /ops/ { return 404; }

    location = /api/v1/realtime {
        proxy_pass $core_origin$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass $core_origin$request_uri;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_no_cache 1;
    }

    location / {
        proxy_pass $web_origin$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

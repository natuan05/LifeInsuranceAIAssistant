[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "life-agent"
version = "0.1.0"
description = "Agent/RAG service (custom LangGraph). Milestone 3: Public RAG trial (corpus, hybrid retrieval, evaluation)."
requires-python = ">=3.13"
# HTTP framework (Starlette + uvicorn, proposal 12.13 #5) is pinned in Task 6. The Gemini trial adapters use the REST API through the
# standard library, so no provider SDK is pinned. psycopg is the PostgreSQL driver for the rag index (pgvector).
dependencies = [
  "langgraph==1.2.20",
  "langgraph-checkpoint==4.3.1",  # BaseCheckpointSaver for the fenced checkpointer (proposal 12.13 #2)
  "jsonschema==4.26.0",
  "psycopg[binary]==3.3.6",
]

[dependency-groups]
dev = ["pytest==9.2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
